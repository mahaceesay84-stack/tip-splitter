<!DOCTYPE html>
<!--
  ============================================================
  ASE300 · Mini-project 1 · The tip splitter. YOUR STARTER.

  The page is finished. Every number on it is D0.00 and nothing
  reacts to typing, because js/app.js is empty. That file is the
  whole build. You do NOT edit this file or the CSS.

  This page is the client's mock. Your spec is written FROM it
  plus the rules in the brief, BEFORE you prompt the agent.

  THE HOOKS. Every element you need to find has a class:

    .bill-input        the bill, in dalasi, e.g. 142.55
    .tip-preset        the five percentage buttons. Each one
                       carries its value in data-tip="15"
    .tip-custom        the "Custom" number input, a percentage
    .people-input      number of people
    .people-error      the "Can't be zero" line, hidden until
                       the people field is invalid
    .out-tip           Tip amount
    .out-total         Total with tip
    .out-person        What each person pays
    .remainder         the line that says who pays the extra
                       butut, hidden until a split is uneven
    .reset             the Reset button

  THE STATES. Every look this page can have is already written
  in css/styles.css and is waiting for a class. Your JavaScript
  only ever adds, removes or toggles these:

    .tip-preset.is-selected      the chosen preset
    .field.is-error              red border on that field
    .people-error.is-hidden      the error line hidden
    .remainder.is-hidden         the remainder line hidden

  Remember: a form value is a string. Always. And money is never
  held in a float: work in bututs, format on the way out.
  ============================================================
-->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splitter · ASE300 Mini-project 1</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/app.js" defer></script>
</head>

<body>
  <header class="site-header">
    <h1 class="wordmark"><img src="assets/logo.svg" alt="Splitter" width="87" height="54"></h1>
  </header>

  <main class="card">
    <section class="inputs" aria-labelledby="inputs-heading">
      <h2 id="inputs-heading" class="visually-hidden">The bill</h2>

      <div class="field field-bill">
        <label for="bill">Bill</label>
        <div class="input-wrap">
          <span class="prefix" aria-hidden="true">D</span>
          <input class="bill-input" id="bill" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00">
        </div>
      </div>

      <div class="field field-tip">
        <p class="field-label" id="tip-label">Select tip %</p>
        <div class="tip-grid" role="group" aria-labelledby="tip-label">
          <button class="tip-preset" type="button" data-tip="5">5%</button>
          <button class="tip-preset" type="button" data-tip="10">10%</button>
          <button class="tip-preset" type="button" data-tip="15">15%</button>
          <button class="tip-preset" type="button" data-tip="25">25%</button>
          <button class="tip-preset" type="button" data-tip="50">50%</button>
          <div class="input-wrap input-custom">
            <label class="visually-hidden" for="tip-custom">Custom tip percentage</label>
            <input class="tip-custom" id="tip-custom" type="number" inputmode="numeric" min="0" max="100" placeholder="Custom">
          </div>
        </div>
      </div>

      <div class="field field-people">
        <div class="label-row">
          <label for="people">Number of people</label>
          <!-- Hidden until the people field is invalid. -->
          <span class="people-error is-hidden" role="alert">Can't be zero</span>
        </div>
        <div class="input-wrap">
          <img class="prefix" src="assets/icon-person.svg" alt="" width="13" height="16">
          <input class="people-input" id="people" type="number" inputmode="numeric" min="1" step="1" placeholder="0">
        </div>
      </div>
    </section>

    <section class="results" aria-labelledby="results-heading">
      <h2 id="results-heading" class="visually-hidden">The split</h2>

      <dl class="result-list">
        <div class="result">
          <dt>Tip</dt>
          <dd class="out-tip">D0.00</dd>
        </div>
        <div class="result">
          <dt>Total <span>with tip</span></dt>
          <dd class="out-total">D0.00</dd>
        </div>
        <div class="result result-person">
          <dt>Each person pays</dt>
          <dd class="out-person">D0.00</dd>
        </div>
      </dl>

      <!-- Hidden until a split does not divide evenly. The words
           inside are yours to write: say who pays the extra butut. -->
      <p class="remainder is-hidden"></p>

      <button class="reset" type="button">Reset</button>
    </section>
  </main>

  <footer>
    <p>ASE300 · Agentic Software Engineering I · JCC · Layout after Frontend Mentor's tip calculator</p>
  </footer>
</body>

</html>
